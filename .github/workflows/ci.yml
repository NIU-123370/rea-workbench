name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: workbench/.nvmrc
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: toolchain
        run: |
          node -v
          npm -v
          test "$(node -v)" = "v24.18.0" || { echo "node must be 24.18.0"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      # The release matrix has to reconcile before anything is called a candidate (T16's
      # document half / A01-A13). A hole here is a build failure, not a warning.
      - name: docs:check (T01-T17 vs A01-A13)
        run: npm run docs:check
      # T17 on this host. A13's interval ends in a browser, and the record now refuses to call the
      # gate satisfied without a lane (infra/perf/t17-graph-update.ts), so this run measures the
      # projection half only and reports gateHostSatisfied=false until the lane runner lands. It is
      # advisory for that reason, not because a failing number is ignorable.
      - name: T17 measurement record (advisory)
        run: |
          mkdir -p .perf
          npm run perf:t17 --silent | sed -n 's/^record: //p' > .perf/t17.json
          node -e "const r=require('./.perf/t17.json');console.log(JSON.stringify({p50:r.p50Ms,p95:r.p95Ms,max:r.maxMs,samples:r.samplesMs.length,host:r.host.platform+'/'+r.host.arch,browserLane:r.gate.browserLane,gateHostSatisfied:r.gateHostSatisfied}))"
          test -s .perf/t17.json
        continue-on-error: true
      # The facts A13's lane needs from this host, printed rather than assumed: which browser the
      # runner image actually ships and what the machine is. Advisory while no step acts on it; the
      # reading is what the lane runner will be written against instead of a guessed binary name.
      - name: A13 lane host facts (advisory)
        run: |
          node -e "console.log('node', process.version, process.platform+'/'+process.arch)"
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          for b in google-chrome google-chrome-stable chromium chromium-browser firefox; do
            if command -v "$b" >/dev/null 2>&1; then echo "$b -> $(command -v "$b") version=$("$b" --version 2>&1 | head -1)"; else echo "$b -> absent"; fi
          done
        continue-on-error: true
      - name: upload T17 record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t17-record
          path: workbench/.perf/t17.json
          if-no-files-found: ignore
